<div class="section" style="margin-bottom: 20px;" x-data="scaleView()">
    <h2 style="margin: 0 0 10px 0;">Scale</h2>
    <template x-if="!hasPreset">
        <p style="color: #999; font-size: 13px;" x-text="emptyHint()"></p>
    </template>
    <template x-if="hasPreset">
        <div class="midi-event scale-block">
            <div class="midi-event-controls">
                <div>
                    <label>Scale</label>
                    <select
                        x-on:change="onKindChange($event)"
                        x-effect="void scaleKindValue; void scaleKinds; $nextTick(() => { $el.value = scaleKindValue })"
                    >
                        <option value="">—</option>
                        <template x-for="opt in scaleKinds" x-bind:key="opt.id">
                            <option x-bind:value="opt.id" x-text="opt.label"></option>
                        </template>
                    </select>
                </div>
                <template x-if="scaleData">
                    <div class="scale-extra-rows">
                        <div class="scale-row scale-row-root-octave">
                            <div>
                                <label>Root</label>
                                <select
                                    x-on:change="onRootChange($event)"
                                    x-effect="void scaleData; $nextTick(() => { if (scaleData) $el.value = scaleData.root })"
                                >
                                    <template x-for="n in rootNotes" x-bind:key="n">
                                        <option x-bind:value="n" x-text="n"></option>
                                    </template>
                                </select>
                            </div>
                            <div>
                                <label>Octave</label>
                                <input
                                    type="number"
                                    min="-8"
                                    max="8"
                                    x-on:change="onOctaveChange($event)"
                                    x-effect="void scaleData; $nextTick(() => { if (scaleData) $el.value = scaleData.octave })"
                                />
                            </div>
                        </div>
                        <div class="scale-row scale-row-voct">
                            <div>
                                <label>V/oct</label>
                                <select
                                    x-on:change="onVOctChange($event)"
                                    x-effect="void scaleData; $nextTick(() => { if (scaleData) $el.value = String(scaleData.vOct ?? 1) })"
                                >
                                    <template x-for="opt in vOctOptions" x-bind:key="opt.value">
                                        <option x-bind:value="String(opt.value)" x-text="opt.label"></option>
                                    </template>
                                </select>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>
</div>
