# Default preset. Uploaded to the device as /presets/ via uploadfs.
# Seven horizontal bands (x in [0,1]); preset scale is filled on load (natural minor, root D).
gestures:
  # MIDI note (chromatic)
  - position: [true, 0.0, 0.0, 0.142857, 1.0]
    midi:
      - channel: 1
        note: 60
        octave: 4
    cv: []
    cv_note: []

  # MIDI note (scale degree I — D natural minor)
  - position: [true, 0.142857, 0.0, 0.285714, 1.0]
    midi:
      - channel: 1
        octave: 4
        scaleDegree: 0
    cv: []
    cv_note: []

  # MIDI CC event
  - position: [true, 0.285714, 0.0, 0.428571, 1.0]
    midi:
      - channel: 1
        cc: 1
        axis: y
        bottom: 0
        top: 127
        singleValue: false
    cv: []
    cv_note: []

  # CV mapping (range)
  - position: [true, 0.428571, 0.0, 0.571429, 1.0]
    midi: []
    cv:
      - channel: 1
        axis: y
        bottom: -5.0
        top: 5.0
        singleValue: false
    cv_note: []

  # CV single value
  - position: [true, 0.571429, 0.0, 0.714286, 1.0]
    midi: []
    cv:
      - channel: 1
        axis: y
        bottom: 0.25
        top: 0.25
        singleValue: true
    cv_note: []

  # CV note (chromatic)
  - position: [true, 0.714286, 0.0, 0.857143, 1.0]
    midi: []
    cv: []
    cv_note:
      - cvChannel: 1
        gateChannel: 2
        note: 60
        octave: 4

  # CV note (scale degree I)
  - position: [true, 0.857143, 0.0, 1.0, 1.0]
    midi: []
    cv: []
    cv_note:
      - cvChannel: 1
        gateChannel: 2
        octave: 4
        scaleDegree: 0
